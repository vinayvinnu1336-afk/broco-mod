# ==============================================================================
# BroCo - production stack for a single VPS (e.g. Hostinger KVM 1/2)
#
#   cp .env.example .env      # then fill in every value marked REQUIRED
#   docker compose up -d
#
# Only Nginx is reachable from the internet (ports 80/443). PostgreSQL, Redis,
# the API and the Next.js server live on a private Docker network.
# Docker publishes ports past the host firewall (ufw), so never add "ports:" to
# the internal services here; use docker-compose.override.yml for local dev.
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: broco-mod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broco_mod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Tuned for a 4-8 GB VPS shared with the rest of the stack.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1g
    logging: *default-logging
    networks:
      - broco-network

  redis:
    image: redis:7-alpine
    container_name: broco-mod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 192m
    logging: *default-logging
    networks:
      - broco-network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: ${BACKEND_IMAGE:-broco-mod-backend:latest}
    container_name: broco-mod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-broco_mod};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};Maximum Pool Size=50
      ConnectionStrings__Redis: redis:6379
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (64+ random characters)}
      Jwt__Issuer: ${JWT_ISSUER:-BroCoMod}
      Jwt__Audience: ${JWT_AUDIENCE:-BroCoModApp}
      PlatformSettings__DefaultSearchRadiusKm: ${DEFAULT_SEARCH_RADIUS_KM:-10.0}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost}
      RateLimiting__AuthPermitPerMinute: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      RateLimiting__ApiPermitPerMinute: ${API_RATE_LIMIT_PER_MINUTE:-300}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Payment__AllowFakeGateway: ${ALLOW_FAKE_PAYMENTS:-false}
      EnableDemoSeeding: ${ENABLE_DEMO_SEEDING:-false}
      Booking__AdvancePercentage: ${BOOKING_ADVANCE_PERCENT:-10}
      Commission__DueHours: ${COMMISSION_DUE_HOURS:-24}
      Commission__ReminderIntervalHours: ${COMMISSION_REMINDER_HOURS:-12}
      Commission__BlockNewJobsAfterOverdueDays: ${COMMISSION_BLOCK_AFTER_DAYS:-3}
      # Google Maps (docs/google-maps-setup.md). Read at startup: a new key needs only
      # `docker compose up -d backend`, no frontend rebuild.
      GoogleMaps__BrowserApiKey: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GoogleMaps__ServerApiKey: ${GOOGLE_MAPS_SERVER_KEY:-}
      Geocoding__FallbackProvider: ${GEOCODING_FALLBACK_PROVIDER:-OpenStreetMap}
      # Job photos and videos (docs/architecture/media.md). Kept in the broco-mod-media volume; back it up with the database.
      Media__StoragePath: /app/data/media
      Media__SigningKey: ${MEDIA_SIGNING_KEY:-}
    volumes:
      - media_data:/app/data/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m
    logging: *default-logging
    networks:
      - broco-network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_DEMO_MODE: ${ENABLE_DEMO_SEEDING:-false}
        # Optional: bakes a browser key into the build (it then wins over the runtime key from the API).
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_BROWSER_KEY_AT_BUILD:-}
        NEXT_PUBLIC_SUPPORT_PHONE: ${SUPPORT_PHONE:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
    image: ${FRONTEND_IMAGE:-broco-mod-frontend:latest}
    container_name: broco-mod-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    logging: *default-logging
    networks:
      - broco-network

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: broco-mod-nginx:latest
    container_name: broco-mod-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    mem_limit: 128m
    logging: *default-logging
    networks:
      - broco-network

  # One-off: docker compose --profile tls run --rm certbot certonly ...  (see docs/deployment/vps-hostinger.md)
  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

networks:
  broco-network:
    name: broco-mod-network
    driver: bridge

volumes:
  postgres_data:
    name: broco-mod-postgres-data
  redis_data:
    name: broco-mod-redis-data
  letsencrypt:
    name: broco-mod-letsencrypt
  certbot_www:
    name: broco-mod-certbot-www
  media_data:
    name: broco-mod-media
