services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: broco-mod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broco_mod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d broco_mod"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - broco-network

  redis:
    image: redis:7-alpine
    container_name: broco-mod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - broco-network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: broco-mod-backend:latest
    container_name: broco-mod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-broco_mod};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__Redis: redis:6379
      PlatformSettings__DefaultSearchRadiusKm: 10.0
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - broco-network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    image: broco-mod-frontend:latest
    container_name: broco-mod-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    networks:
      - broco-network

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: broco-mod-nginx:latest
    container_name: broco-mod-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    networks:
      - broco-network

networks:
  broco-network:
    name: broco-mod-network
    driver: bridge

volumes:
  postgres_data:
    name: broco-mod-postgres-data
  redis_data:
    name: broco-mod-redis-data
