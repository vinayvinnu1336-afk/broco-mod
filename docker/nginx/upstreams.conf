# Upstreams, rate-limit zones and compression shared by every server block.
# To add API replicas later, add more "server" lines (e.g. backend-2:5000) to backend_service.

upstream backend_service {
    server backend:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_service {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Per-client-IP request rate limits
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=page_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server_tokens off;

gzip on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/manifest+json;
