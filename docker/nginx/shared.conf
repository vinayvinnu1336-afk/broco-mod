# Shared location rules, included by both the HTTP and HTTPS server blocks.

client_max_body_size 10m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

# Let's Encrypt HTTP-01 challenge
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

# Authentication endpoints: strict per-IP limit (brute force / credential stuffing)
location /api/v1/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend_service;
    include /etc/nginx/proxy_params.conf;
}

# Job photos and videos (docs/architecture/media.md): one upload of up to 100 MB per request, and
# streaming with range requests so videos seek. Bodies go straight to the API instead of being buffered.
# proxy_params.conf is not included because its 30 s timeouts are too short for a video on mobile data.
location /api/v1/media/ {
    limit_req zone=api_limit burst=120 nodelay;
    limit_req_status 429;
    client_max_body_size 110m;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://backend_service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# API
location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://backend_service;
    include /etc/nginx/proxy_params.conf;
}

# Liveness probe only; readiness and details stay internal
location = /healthz/live {
    proxy_pass http://backend_service/healthz/live;
    include /etc/nginx/proxy_params.conf;
    access_log off;
}

# Swagger and diagnostics are never exposed publicly
location ~ ^/(swagger|health|healthz)(/|$) {
    return 404;
}

# Next.js hashed build assets are immutable
location /_next/static/ {
    proxy_pass http://frontend_service;
    include /etc/nginx/proxy_params.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Frontend
location / {
    limit_req zone=page_limit burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://frontend_service;
    include /etc/nginx/proxy_params.conf;
}
